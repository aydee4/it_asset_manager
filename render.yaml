services:
  - type: web
    name: sedo-secure-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        value: sqlite:///assets.db
      - key: SECRET_KEY
        sync: false
