<!DOCTYPE html>
{% extends "base.html" %} {% block title %}Add Asset{% endblock %} {% block
content %}
<h2 class="mb-4">Add Asset</h2>
<!-- Form for admins to add a new asset -->
<form method="POST" class="mb-3">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" name="name" class="form-control" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Serial Number</label>
    <input type="text" name="serial" class="form-control" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Type</label>
    <input type="text" name="type" class="form-control" required />
  </div>
  <div class="mb-3">
    <button type="submit" class="btn btn-success">Add Asset</button>
  </div>
</form>

<p>
  <a href="{{ url_for('asset_list') }}" class="btn btn-outline-secondary"
    >Back to Assets</a
  >
</p>
{% endblock %}
